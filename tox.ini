[tox]
env_list = py{310,311,312,313}-bottle{012,013}, py314-bottle013
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    httpx
    bottle012: bottle>=0.12.25,<0.13
    bottle013: bottle>=0.13.4,<0.14
    py313-bottle012: legacy-cgi
commands =
    python -c "import bottle; print('bottle', bottle.__version__)"
    pytest tests/ -v
