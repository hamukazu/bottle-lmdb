name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        bottle: ["bottle012", "bottle013"]
        exclude:
          # bottle 0.12 imports the cgi module, removed in Python 3.13
          - python-version: "3.13"
            bottle: "bottle012"
          - python-version: "3.14"
            bottle: "bottle012"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          PY: ${{ matrix.python-version }}
        run: uv run --python "$PY" tox run -e "py$(echo "$PY" | tr -d .)-${{ matrix.bottle }}"

      - name: Run mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/
